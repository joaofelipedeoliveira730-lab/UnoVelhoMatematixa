<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>UnoVelho</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="menu-background">
    
    <!-- Topo: Moedas e XP do Jogador -->
    <header class="hud-topo">
        <div class="status-jogador">
            <span class="xp-badge">XP: 150</span>
            <span class="bruto-coins">💰 1200 BrutoCoins</span>
        </div>
    </header>

    <main class="container-principal">
        <!-- Esquerda: Título e Botões -->
        <section class="menu-acoes">
            <h1 class="logo-animada">UNO VELHO</h1>
            
            <div class="botoes-container">
                <button class="btn btn-jogar">JOGAR</button>
                <button class="btn btn-criar">CRIAR PARTIDA</button>
                <button class="btn btn-loja">LOJA</button>
                <button class="btn btn-config">CONFIGURAÇÕES</button>
            </div>
        </section>

        <!-- Direita: Pódio Estático (Sem botão) -->
        <section class="podio-lateral">
            <div class="podio-conteudo">
                <h3>Seu Destaque</h3>
                <img src="ceo_skin.png" alt="Sua Skin Atual" class="skin-destaque">
                <div class="base-podio">
                    <span class="posicao">🏆 1º</span>
                </div>
            </div>
        </section>
    </main>

    <!-- O resto dos seus modais (configurações, etc) continuam aqui -->
</body>
</html>
